 <!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nest - Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <i class="fa-solid fa-leaf"></i>
                    <span>Nest</span>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" id="tab-login">Sign In</button>
                    <button class="tab-btn" id="tab-register">Register</button>
                </div>
            </div>

            <div class="auth-body">
                <div id="auth-message" class="auth-message"></div>

                <form id="login-form" class="auth-form active">
                    <h2>Kirish</h2>
                    <p class="form-desc">Profilingizga kirish uchun ma'lumotlarni kiriting.</p>
                    
                    <div class="form-group">
                        <label for="login-email">E-mail manzili</label>
                        <input type="email" id="login-email" required placeholder="Sizning emailingiz...">
                    </div>
                    
                    <div class="form-group">
                        <label for="login-password">Parol</label>
                        <input type="password" id="login-password" required placeholder="Sizning parolingiz...">
                    </div>
                    
                    <button type="submit" class="submit-btn">Tizimga kirish</button>
                </form>

                <form id="register-form" class="auth-form">
                    <h2>Ro'yxatdan o'tish</h2>
                    <p class="form-desc">Yangi profil yaratish uchun quyidagi formani to'ldiring.</p>

                    <div class="form-group">
                        <label for="reg-name">To'liq ismingiz</label>
                        <input type="text" id="reg-name" required placeholder="Ismingiz...">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-email">E-mail manzili</label>
                        <input type="email" id="reg-email" required placeholder="Emailingiz...">
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password">Parol</label>
                        <input type="password" id="reg-password" required placeholder="Kamida 6 ta belgi...">
                    </div>
                    
                    <button type="submit" class="submit-btn">Ro'yxatdan o'tish</button>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
